name: HDMF Dev Branch Compatibility

on: [pull_request, workflow_dispatch]

jobs:
  check_compatibility:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags are required to determine the version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install HDMF_Zarr Requirements
        run: |
          python -m pip install --group test "."

      - name: Clone and Install HDMF Dev Branch
        run: |
          git clone https://github.com/hdmf-dev/hdmf.git --recurse-submodules
          cd hdmf
          python -m pip install --group test .
          cd ..

      - name: Clone and Install PyNWB Dev Branch
        # PyNWB dev tracks HDMF dev's interfaces (e.g., the abstract HERDManager added in
        # HDMF 5.1+). Released PyNWB may not yet satisfy these, so install PyNWB dev too.
        run: |
          git clone https://github.com/NeurodataWithoutBorders/pynwb.git --recurse-submodules
          cd pynwb
          python -m pip install .
          cd ..

      - name: Run HDMF_Zarr Tests
        run:
          # specify the tests directory so that we don't run the hdmf tests which are nested
          # under the same base directory
          pytest -v tests
